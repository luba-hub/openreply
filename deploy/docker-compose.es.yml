# es-funnel on our box: web (127.0.0.1:3240, nginx in front with TLS), worker, cron, Postgres, Redis.
# Nothing but the web port is published, and only on localhost.
#   cd /srv/openreply && docker compose -f deploy/docker-compose.es.yml --env-file .env up -d --build
# .env: .env.example's values, with DATABASE_URL=postgresql://openreply:${POSTGRES_PASSWORD}@postgres:5432/openreply,
# REDIS_URL=redis://redis:6379, NEXTAUTH_URL=https://<the domain>, ALLOWED_EMAILS=<the owner only>.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: openreply
      POSTGRES_USER: openreply
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [ "/srv/openreply/pg:/var/lib/postgresql/data" ]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U openreply"], interval: 5s, timeout: 5s, retries: 10 }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [ "/srv/openreply/redis:/data" ]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 5s, retries: 10 }

  web:
    build: { context: .., dockerfile: Dockerfile }
    image: openreply-es
    restart: unless-stopped
    env_file: ../.env
    # Migrations run at start, never at build (the box's database isn't reachable from a build).
    command: ["sh", "-c", "npx prisma migrate deploy && npm run start"]
    ports: [ "127.0.0.1:3240:3000" ]
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy } }
    # Up = serving pages. /api/health also needs the worker's heartbeat, so it can't gate the worker's start.
    healthcheck: { test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/ || exit 1"], interval: 15s, timeout: 10s, retries: 20, start_period: 60s }

  worker:
    image: openreply-es
    restart: unless-stopped
    env_file: ../.env
    environment: { DB_POOL_MAX: "5" }
    command: ["npm", "run", "worker"]
    # After web is serving, so its migrations have run.
    depends_on: { web: { condition: service_healthy } }

  cron:
    image: openreply-es
    restart: unless-stopped
    command: ["sh", "scripts/cron.sh"]
    env_file: ../.env
    environment: { CRON_BASE_URL: "http://web:3000" }
    depends_on: { web: { condition: service_healthy } }
